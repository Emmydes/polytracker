services:
  - type: web
    name: polytracker
    runtime: node
    buildCommand: npm run install:all && npm run build
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOOTSTRAP_DISCOVERY_LIMIT
        value: "60"
      - key: DISCOVERY_BATCH_SIZE
        value: "12"
      - key: DISCOVERY_LEADERBOARD_LIMIT
        value: "100"
